# Low-process profile for secondary concurrent Codex sessions. The Serena
# bridge remains enabled: it is cheap and shares one lazy backend per project.
# Other local stdio MCPs stay parked. Agents, skills, remote MCPs, built-in
# memories, hooks, and apps are not disabled here.

[mcp_servers.context7]
enabled = false

[mcp_servers.sequential-thinking]
enabled = false

[mcp_servers.playwright]
enabled = false

[mcp_servers.chrome-devtools]
enabled = false

[mcp_servers.serena]
enabled = true

[mcp_servers.memory]
enabled = false

[mcp_servers.codebase-memory]
enabled = false
