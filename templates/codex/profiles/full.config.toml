# Full local MCP profile.
# Use for one primary session that needs every bundled local MCP capability.
# Serena stays project-shared through its lazy bridge; the other local helpers
# in this profile remain eager per session.

[mcp_servers.context7]
enabled = true

[mcp_servers.sequential-thinking]
enabled = true

[mcp_servers.playwright]
enabled = true

[mcp_servers.chrome-devtools]
enabled = true

[mcp_servers.serena]
enabled = true

[mcp_servers.memory]
enabled = true

[mcp_servers.codebase-memory]
enabled = true
